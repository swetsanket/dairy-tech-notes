  <!-- MAIN APP JAVASCRIPT -->
  <script src="js/app.js"></script>

  <!-- PWA INSTALL + SERVICE WORKER -->
  <script>

    let deferredPrompt = null;

    const installPopup = document.getElementById("installPopup");
    const installNow = document.getElementById("installNow");
    const installLater = document.getElementById("installLater");
    const installClose = document.getElementById("installClose");

    function hideInstallPopup() {
      if (installPopup) {
        installPopup.hidden = true;
      }
    }

    function closeInstallPopup() {
      hideInstallPopup();

      try {
        localStorage.setItem("installPopupClosed", "true");
      } catch (error) {
        console.log("Could not save install popup state.");
      }
    }

    function showInstallPopup() {

      let alreadyClosed = false;

      try {
        alreadyClosed =
          localStorage.getItem("installPopupClosed") === "true";
      } catch (error) {
        alreadyClosed = false;
      }

      if (alreadyClosed) {
        return;
      }

      if (installPopup) {
        installPopup.hidden = false;
      }
    }

    /* Browser gives us the install option */
    window.addEventListener("beforeinstallprompt", (event) => {

      event.preventDefault();

      deferredPrompt = event;

      /*
        Show our custom popup after around 2 seconds.
      */
      setTimeout(() => {
        showInstallPopup();
      }, 2000);

    });

    /* Install button */
    if (installNow) {

      installNow.addEventListener("click", async () => {

        if (!deferredPrompt) {
          return;
        }

        deferredPrompt.prompt();

        const choice = await deferredPrompt.userChoice;

        console.log(
          "Install choice:",
          choice.outcome
        );

        deferredPrompt = null;

        hideInstallPopup();

        if (choice.outcome === "accepted") {

          try {
            localStorage.setItem(
              "installPopupClosed",
              "true"
            );
          } catch (error) {}

        }

      });

    }

    /* Maybe Later */
    if (installLater) {
      installLater.addEventListener(
        "click",
        closeInstallPopup
      );
    }

    /* X button */
    if (installClose) {
      installClose.addEventListener(
        "click",
        closeInstallPopup
      );
    }

    /* App successfully installed */
    window.addEventListener("appinstalled", () => {

      deferredPrompt = null;

      hideInstallPopup();

      try {
        localStorage.setItem(
          "installPopupClosed",
          "true"
        );
      } catch (error) {}

      console.log(
        "Dairy Tech Notes installed successfully."
      );

    });

    /* Register Service Worker */
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./service-worker.js")
          .then((registration) => {

            console.log(
              "Service Worker registered:",
              registration.scope
            );

          })
          .catch((error) => {

            console.error(
              "Service Worker registration failed:",
              error
            );

          });

      });

    }

  </script>
