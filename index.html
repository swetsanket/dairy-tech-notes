<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#1f6b4a" />
  <link rel="manifest" href="./manifest.json" />

  <title>B.Tech Dairy Technology</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark">DT</span>

      <span class="brand-text">
        <strong>Dairy Technology</strong>
        <small>B.Tech study library</small>
      </span>
    </a>

    <nav class="top-nav">
      <a href="#/notes">Notes</a>
      <a href="#/textbook">Textbook</a>
      <a href="#/ppt">PPT</a>
      <a href="#/admin" class="nav-admin">Admin</a>
    </nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-foot">
    <p>
      Made by <strong>Swet Sanket</strong> · B.Tech Dairy Technology
    </p>
  </footer>

  <script src="js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then((registration) => {
            console.log(
              "Service Worker registered:",
              registration.scope
            );
          })
          .catch((error) => {
            console.error(
              "Service Worker registration failed:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
